<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jq 语法复杂场景测试用例集 · 200 例对比手册</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231e2530'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' fill='%235eead4' text-anchor='middle'%3Ejq%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f5f7; --card:#ffffff; --ink:#1b222b; --sub:#5c6875; --line:#e3e8ee;
  --code-bg:#1e2530; --code-ink:#e6edf3;
  --in-head:#157a4b; --in-bg:#eef7f1; --in-line:#cfe9db;
  --out-head:#1f6f8b; --out-bg:#eef5f8; --out-line:#cfe4ec;
  --accent:#2456a6; --warn:#b45309; --err:#b42318;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Consolas,"Liberation Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.6; overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}
/* ===== 顶部工具条 ===== */
.toolbar{
  position:sticky; top:0; z-index:50; background:#fff;
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 6px rgba(20,30,45,.06);
}
.toolbar-inner{max-width:1280px; margin:0 auto; padding:12px 16px;}
.toolbar h1{font-size:17px; margin:0 0 10px; font-weight:700; letter-spacing:.2px;}
.toolbar h1 .cnt{color:var(--sub); font-weight:500; font-size:13px; margin-left:8px;}
.controls{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
.controls input[type=search], .controls select{
  font-family:var(--sans); font-size:15px; color:var(--ink);
  border:1px solid var(--line); border-radius:8px; background:#f7f9fb;
  padding:8px 10px; min-height:40px;
}
.controls input[type=search]{flex:1 1 180px;}
.controls select{flex:0 1 auto; max-width:220px;}
.controls button{
  font-family:var(--sans); font-size:14px; min-height:40px; padding:8px 12px;
  border:1px solid var(--line); background:#fff; border-radius:8px; color:var(--ink);
  cursor:pointer;
}
.controls button:hover{background:#f2f5f8;}
.stats{margin-top:8px; font-size:13px; color:var(--sub); display:flex; flex-wrap:wrap; gap:14px;}
.stats b{color:var(--ink);}
/* ===== 主体列表 ===== */
.wrap{max-width:1280px; margin:0 auto; padding:16px;}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  margin-bottom:18px; overflow:hidden;
}
.card-head{padding:14px 16px 10px; border-bottom:1px solid var(--line);}
.card-top{display:flex; flex-wrap:wrap; align-items:center; gap:8px;}
.badge-id{
  font-family:var(--mono); font-size:13px; font-weight:700; color:#fff;
  background:var(--code-bg); border-radius:7px; padding:3px 9px; white-space:nowrap;
}
.tag-cat{
  font-size:12px; color:var(--accent); background:#eef3fb; border:1px solid #d9e6f7;
  border-radius:999px; padding:2px 10px; white-space:nowrap;
}
.status{font-size:12px; border-radius:999px; padding:2px 10px; white-space:nowrap;}
.status.success{color:var(--in-head); background:var(--in-bg); border:1px solid var(--in-line);}
.status.expected_error{color:var(--warn); background:#fdf3e7; border:1px solid #f3ddbd;}
.card-title{font-size:15.5px; font-weight:600; margin:8px 0 0;}
.req{padding:12px 16px 0; color:#33404d;}
.req .req-label{font-size:12px; color:var(--sub); font-weight:600; display:block; margin-bottom:4px;}
/* ===== 表达式条 ===== */
.expr{margin:12px 16px 0; background:var(--code-bg); border-radius:10px; position:relative;}
.expr-head{display:flex; align-items:center; justify-content:space-between; padding:8px 12px;}
.expr-head .lbl{font-size:12px; color:#9fb0c3; letter-spacing:.4px;}
.copy-btn{
  font-family:var(--sans); font-size:12px; color:#c9d6e3; background:transparent;
  border:1px solid #394557; border-radius:6px; padding:4px 10px; cursor:pointer;
}
.copy-btn:hover{background:#2b3543; color:#fff;}
.expr pre{margin:0; padding:0 12px 12px; color:var(--code-ink); font-family:var(--mono);
  font-size:13px; white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere;}
/* ===== 左右对比面板 ===== */
.compare{display:grid; grid-template-columns:1fr; gap:12px; padding:12px 16px 16px;}
@media (min-width:768px){ .compare{grid-template-columns:1fr 1fr; gap:14px;} }
.panel{border:1px solid var(--line); border-radius:10px; min-width:0; overflow:hidden;}
.panel-head{display:flex; align-items:center; justify-content:space-between; padding:8px 12px; font-size:13px; font-weight:600;}
.panel.in .panel-head{color:var(--in-head); background:var(--in-bg); border-bottom:1px solid var(--in-line);}
.panel.out .panel-head{color:var(--out-head); background:var(--out-bg); border-bottom:1px solid var(--out-line);}
.panel-head .kind{font-family:var(--mono); font-size:11px; font-weight:400; color:var(--sub);}
.panel pre{margin:0; padding:12px; font-family:var(--mono); font-size:12.5px; line-height:1.55;
  white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere; min-width:0;}
.panel.in pre{background:#fbfdfc;}
.panel.out pre{background:#fbfdfe;}
.panel.out.err pre{color:var(--err);}
/* JSON 高亮配色 */
.jk{color:#2456a6;} .js{color:#157a4b;} .jn{color:#b45309;}
.jb{color:#7c3aed;} .jnl{color:#8a94a0;}
.multi-val{margin-bottom:10px;} .multi-val:last-child{margin-bottom:0;}
.multi-sep{color:#c2ccd6; margin:2px 0 8px; font-family:var(--mono); font-size:11px;}
/* 空结果提示 */
.empty{color:var(--sub); font-family:var(--mono); font-size:12.5px;}
/* 回到顶部 */
#toTop{
  position:fixed; right:16px; bottom:20px; z-index:60; min-height:44px; min-width:44px;
  border-radius:50%; border:1px solid var(--line); background:#fff; color:var(--ink);
  box-shadow:0 4px 14px rgba(20,30,45,.15); cursor:pointer; display:none; font-size:18px;
}
#toTop.show{display:flex; align-items:center; justify-content:center;}
.foot{max-width:1280px; margin:0 auto; padding:8px 16px 40px; color:var(--sub); font-size:13px;}
.no-result{padding:40px 16px; text-align:center; color:var(--sub);}
@media (max-width:560px){
  .wrap{padding:12px;}
  .card{border-radius:12px;}
  .controls input[type=search]{flex:1 1 100%;}
  .controls input[type=search], .controls select{font-size:16px;}
  .controls select{flex:1 1 45%;}
  .controls button{flex:1 1 45%;}
}
</style>
</head>
<body>
<header class="toolbar">
  <div class="toolbar-inner">
    <h1>jq 语法复杂场景测试用例集<span class="cnt">200 例 · 输入 / 输出左右对比 · jq 1.6 实测</span></h1>
    <div class="controls">
      <input type="search" id="search" placeholder="搜索标题、需求、表达式、分类…" aria-label="搜索用例">
      <select id="catFilter" aria-label="按分类筛选"></select>
      <select id="statusFilter" aria-label="按状态筛选">
        <option value="">全部状态</option>
        <option value="success">执行成功</option>
        <option value="expected_error">预期抛出错误</option>
      </select>
      <button id="expandAll" type="button">全部展开</button>
      <button id="collapseAll" type="button">全部折叠</button>
    </div>
    <div class="stats">
      <span>显示 <b id="shown">0</b> / <b id="total">0</b></span>
      <span>成功 <b id="nOk">0</b></span>
      <span>预期报错 <b id="nErr">0</b></span>
    </div>
  </div>
</header>

<main class="wrap" id="list"></main>
<div class="no-result" id="emptyTip" style="display:none;">没有匹配的用例，换个关键词或筛选条件试试。</div>
<footer class="foot">所有表达式均在本机 jq 1.6 下实际执行；右侧为真实执行输出。点击表达式右侧按钮可复制 jq 表达式。</footer>
<button id="toTop" type="button" aria-label="回到顶部">↑</button>

<script>
const CASES = [{"id":1,"cat":"基础字段访问","title":"提取电商商品标题","req":"商品详情接口返回了商品对象，运营同学只需要拿到商品的标题字段用于列表展示。","expr":".title","status":"success","inp":{"sku_id":"SKU-88213","title":"北欧实木餐椅 胡桃木色 45cm","price":329.0,"stock":126,"on_sale":true},"out":"北欧实木餐椅 胡桃木色 45cm","outText":null},{"id":2,"cat":"基础字段访问","title":"读取嵌套订单收货城市","req":"订单数据里收货地址嵌套在 shipping.address 下，客服需要直接取出城市名核对配送范围。","expr":".shipping.address.city","status":"success","inp":{"order_no":"SO202611020091","shipping":{"receiver":"陈先生","address":{"province":"广东省","city":"深圳市","district":"宝安区","detail":"沙井街道兴业路 88 号"}}},"out":"深圳市","outText":null},{"id":3,"cat":"数组索引","title":"取购物车第二件商品","req":"购物车数组下标从 0 开始，前端需要渲染第二件商品的名称，用于轮播提示。","expr":".items[1].name","status":"success","inp":{"cart_id":"CART-5501","items":[{"name":"无线鼠标","price":89.9},{"name":"机械键盘 87 键","price":259.0},{"name":"鼠标垫大号","price":39.0}]},"out":"机械键盘 87 键","outText":null},{"id":4,"cat":"多层嵌套","title":"取用户最近一笔订单实付金额","req":"用户档案里 orders 是按时间倒序排列的，需要取出第一笔订单的实付金额做会员等级判断。","expr":".orders[0].paid_amount","status":"success","inp":{"user_id":10238,"profile":{"name":"林晓","level":"gold"},"orders":[{"order_no":"A9001","paid_amount":486.5},{"order_no":"A8977","paid_amount":129.0},{"order_no":"A8902","paid_amount":238.0}]},"out":486.5,"outText":null},{"id":5,"cat":"可选值默认","title":"昵称缺失时回退为匿名用户","req":"部分老用户资料里没有 nickname 字段，页面展示时若为空必须回退成“匿名用户”，不能显示 null。","expr":".nickname // \"匿名用户\"","status":"success","inp":{"user_id":7712,"nickname":null,"register_channel":"web"},"out":"匿名用户","outText":null},{"id":6,"cat":"安全导航","title":"地址字段可能整体缺失时安全取城市","req":"游客账号可能没有 profile.address 节点，需要用可选导航避免 jq 直接报错中断批处理。","expr":".profile.address.city?","status":"success","inp":{"user_id":3009,"profile":{"name":"访客"}},"out":null,"outText":"null"},{"id":7,"cat":"管道","title":"管道串联：先取订单列表再提取金额","req":"财务对账脚本需要先拿到 orders 数组，再把每笔订单的金额抽出来，演示管道 | 的串联用法。","expr":".orders | map(.amount)","status":"success","inp":{"shop":"晨光文具旗舰店","orders":[{"no":"O1","amount":56.0},{"no":"O2","amount":132.8},{"no":"O3","amount":24.5}]},"out":[56,132.8,24.5],"outText":null},{"id":8,"cat":"数组迭代","title":"迭代输出所有商品标题","req":"搜索结果页需要逐条打印每个商品标题，遍历数组元素并逐个产出结果。","expr":".results[].title","status":"success","inp":{"keyword":"降噪耳机","results":[{"id":1,"title":"索尼 WH-1000XM5"},{"id":2,"title":" Bose QC45"},{"id":3,"title":"漫步者 W820NB"}]},"out":null,"outText":"\"索尼 WH-1000XM5\"\n\" Bose QC45\"\n\"漫步者 W820NB\""},{"id":9,"cat":"构造对象","title":"由原始数据构造精简报表对象","req":"上游返回了完整用户订单，报表只需要姓名、订单号、实付金额三个字段，用 {键: 表达式} 重新组装。","expr":"{customer: .user.name, order_no: .order.no, paid: .order.paid}","status":"success","inp":{"user":{"name":"赵磊","phone":"138****6621"},"order":{"no":"PO-2026-1102","paid":762.3,"coupon":30.0}},"out":{"customer":"赵磊","order_no":"PO-2026-1102","paid":762.3},"outText":null},{"id":10,"cat":"构造数组","title":"构造商品价格数组","req":"统计模块需要把所有商品单价收集成一个纯数字数组，供后续求和、求最大值使用。","expr":"[.items[].price]","status":"success","inp":{"items":[{"sku":"A1","price":19.9},{"sku":"A2","price":45.0},{"sku":"A3","price":128.5}]},"out":[19.9,45,128.5],"outText":null},{"id":11,"cat":"多值输出","title":"并列输出姓名与年龄","req":"人员名单导出时同一行需要同时给出姓名和年龄两个独立结果，用逗号分隔多个表达式。","expr":".name, .age","status":"success","inp":{"name":"王芳","age":34,"department":"财务部"},"out":null,"outText":"\"王芳\"\n34"},{"id":12,"cat":"长度统计","title":"统计购物车商品数量","req":"购物车角标需要展示商品件数，直接对数组取 length。","expr":".cart.items | length","status":"success","inp":{"cart":{"items":[10,20,30,40,50]}},"out":5,"outText":null},{"id":13,"cat":"对象键列表","title":"列出用户档案全部字段名","req":"数据治理排查时需要知道这条记录都包含哪些顶层字段，输出排序后的键名数组。","expr":"keys","status":"success","inp":{"user_id":9012,"name":"周敏","level":"silver","city":"杭州","tags":["新客","母婴"]},"out":["city","level","name","tags","user_id"],"outText":null},{"id":14,"cat":"字段存在判断","title":"判断记录是否包含手机号字段","req":"数据清洗规则要求区分已绑定手机与未绑定手机的用户，用 has 判断字段是否存在。","expr":"has(\"phone\")","status":"success","inp":{"user_id":4421,"name":"吴桐","email":"wutong@example.com"},"out":false,"outText":null},{"id":15,"cat":"条件分支","title":"按订单金额标记大额/普通订单","req":"风控规则：实付金额大于等于 1000 标记为“大额”，否则为“普通”，用 if/then/elif/else/end 实现。","expr":"if .paid_amount >= 1000 then \"大额订单\" elif .paid_amount >= 300 then \"中等订单\" else \"普通订单\" end","status":"success","inp":{"order_no":"SO-7781","paid_amount":1280.0},"out":"大额订单","outText":null},{"id":16,"cat":"select 过滤","title":"筛选出已支付订单","req":"对账只统计 status 为 paid 的订单，用 select 保留满足条件的元素。","expr":".orders[] | select(.status == \"paid\")","status":"success","inp":{"orders":[{"no":"O1","status":"paid","amount":88.0},{"no":"O2","status":"pending","amount":156.0},{"no":"O3","status":"paid","amount":42.5},{"no":"O4","status":"refunded","amount":70.0}]},"out":null,"outText":"{\n  \"no\": \"O1\",\n  \"status\": \"paid\",\n  \"amount\": 88\n}\n{\n  \"no\": \"O3\",\n  \"status\": \"paid\",\n  \"amount\": 42.5\n}"},{"id":17,"cat":"map 映射","title":"批量提取商品名称列表","req":"下拉选项需要只展示商品名称，对数组每个元素执行 .name 提取。","expr":"[.products[].name]","status":"success","inp":{"products":[{"id":1,"name":"笔记本 A5"},{"id":2,"name":"中性笔 0.5"},{"id":3,"name":"文件架三层"}]},"out":["笔记本 A5","中性笔 0.5","文件架三层"],"outText":null},{"id":18,"cat":"map_values","title":"对对象所有数值字段统一加 10% 缓冲","req":"库存安全库存规则要求每个仓库库存字段都上浮 10%，用 map_values 对对象值批量处理。","expr":".warehouse | map_values(. * 1.1)","status":"success","inp":{"warehouse":{"beijing":120,"shanghai":86,"guangzhou":210}},"out":{"beijing":132,"shanghai":94.60000000000001,"guangzhou":231.00000000000003},"outText":null},{"id":19,"cat":"数组排序","title":"价格数组升序排列","req":"比价页面需要把候选价格从小到大排列，演示基础 sort。","expr":".prices | sort","status":"success","inp":{"prices":[129.9,45.0,320.0,68.5,88.0]},"out":[45,68.5,88,129.9,320],"outText":null},{"id":20,"cat":"sort_by 排序","title":"商品按价格升序排列","req":"列表默认按单价从低到高展示，用 sort_by 指定排序键。","expr":".goods | sort_by(.price)","status":"success","inp":{"goods":[{"name":"数据线","price":19.9},{"name":"充电宝","price":129.0},{"name":"充电器","price":59.5}]},"out":[{"name":"数据线","price":19.9},{"name":"充电器","price":59.5},{"name":"充电宝","price":129}],"outText":null},{"id":21,"cat":"数组去重","title":"对用户标签去重","req":"标签合并过程中出现重复，画像系统要求标签集合不重复，使用 unique。","expr":".tags | unique","status":"success","inp":{"user_id":6631,"tags":["数码","学生","数码","通勤","学生","夜猫子"]},"out":["夜猫子","学生","数码","通勤"],"outText":null},{"id":22,"cat":"group_by 分组","title":"订单按状态分组汇总","req":"运营看板需要按订单状态把订单归类到不同数组里，使用 group_by 按 status 分组。","expr":".orders | group_by(.status)","status":"success","inp":{"orders":[{"no":"O1","status":"paid"},{"no":"O2","status":"unpaid"},{"no":"O3","status":"paid"},{"no":"O4","status":"unpaid"},{"no":"O5","status":"cancelled"}]},"out":[[{"no":"O5","status":"cancelled"}],[{"no":"O1","status":"paid"},{"no":"O3","status":"paid"}],[{"no":"O2","status":"unpaid"},{"no":"O4","status":"unpaid"}]],"outText":null},{"id":23,"cat":"min/max","title":"找出候选报价最高价","req":"采购比价需要知道这批供应商报价里的最高价格，直接用 max。","expr":".quotes | max","status":"success","inp":{"quotes":[235.5,218.0,260.8,229.9]},"out":260.8,"outText":null},{"id":24,"cat":"min_by/max_by","title":"找出最低价商品及其完整信息","req":"促销推荐“最便宜商品”，需要返回整条记录而不只是价格，使用 min_by(.price)。","expr":".goods | min_by(.price)","status":"success","inp":{"goods":[{"name":"A4 打印纸","price":25.9},{"name":"订书机","price":39.0},{"name":"双面胶","price":9.9}]},"out":{"name":"双面胶","price":9.9},"outText":null},{"id":25,"cat":"数组求和","title":"计算当月订单总额","req":"财务日报把每笔订单金额求和得到月度总营收，使用 add。","expr":".amounts | add","status":"success","inp":{"month":"2026-11","amounts":[486.5,129.0,238.0,762.3,99.9]},"out":1715.7,"outText":null},{"id":26,"cat":"any/all","title":"判断是否存在库存不足商品 / 是否全部有货","req":"下单前校验：只要有一件库存为 0 就不能整批提交；同时验证 all 是否全部在库，组合演示 any 与 all。","expr":"{has_oos: any(.cart[]; .stock == 0), all_in_stock: all(.cart[]; .stock > 0)}","status":"success","inp":{"cart":[{"name":"键盘","stock":15},{"name":"鼠标","stock":0},{"name":"显示器","stock":8}]},"out":{"has_oos":true,"all_in_stock":false},"outText":null},{"id":27,"cat":"flatten 展平","title":"展平多层嵌套的店铺商品数组","req":"数据结构按店铺分组导致商品数组两层嵌套，统计前需要 flatten 展平成一维数组。","expr":".shops | flatten","status":"success","inp":{"shops":[[{ ":1299.0},{"name":"入耳式","price":399.0}]},{"name":"音箱","items":[{"name":"便携音箱","price":259.0}]}]}},"out":[1299,399,259],"outText":null},{"id":48,"cat":"paths 路径","title":"列出嵌套记录中所有可达路径","req":"接口联调时需要梳理出返回体里所有字段路径，使用 paths 输出数组形式的路径段。","expr":"paths","status":"success","inp":{"user":{"id":1,"name":"Tom","address":{"city":"Beijing","zip":"100000"}}},"out":null,"outText":"[\n  \"user\"\n]\n[\n  \"user\",\n  \"id\"\n]\n[\n  \"user\",\n  \"name\"\n]\n[\n  \"user\",\n  \"address\"\n]\n[\n  \"user\",\n  \"address\",\n  \"city\"\n]\n[\n  \"user\",\n  \"address\",\n  \"zip\"\n]"},{"id":49,"cat":"leaf_paths 叶子","title":"只列出叶子节点路径","req":"参数校验只关心最末端的标量字段，使用 leaf_paths 过滤掉中间容器路径。","expr":"leaf_paths","status":"success","inp":{"order":{"no":"O1","address":{"city":"Shanghai","detail":"南京东路 1 号"},"items":[{"qty":2}]}},"out":null,"outText":"[\n  \"order\",\n  \"no\"\n]\n[\n  \"order\",\n  \"address\",\n  \"city\"\n]\n[\n  \"order\",\n  \"address\",\n  \"detail\"\n]\n[\n  \"order\",\n  \"items\",\n  0,\n  \"qty\"\n]"},{"id":50,"cat":"类型判断","title":"判断各字段属于哪种 JSON 类型","req":"兼容性脚本需要根据 type 结果分别走不同处理分支，先识别字符串、数字、布尔、null、数组、对象。","expr":"{name_type: (.name | type), age_type: (.age | type), vip_type: (.vip | type), remark_type: (.remark | type), hobbies_type: (.hobbies | type), extra_type: (.extra | type)}","status":"success","inp":{"name":"示例","age":28,"vip":true,"remark":null,"hobbies":["阅读"],"extra":{}},"out":{"name_type":"string","age_type":"number","vip_type":"boolean","remark_type":"null","hobbies_type":"array","extra_type":"object"},"outText":null},{"id":51,"cat":"对象合并","title":"默认配置与用户配置合并覆盖","req":"前端主题配置：默认配置为基础，用户自定义配置只覆盖指定项，使用对象 + 合并语义。","expr":".defaults + .user","status":"success","inp":{"defaults":{"theme":"light","font_size":14,"lang":"zh-CN","notify":true},"user":{"theme":"dark","font_size":16}},"out":{"theme":"dark","font_size":16,"lang":"zh-CN","notify":true},"outText":null},{"id":52,"cat":"getpath 路径取值","title":"按动态路径数组读取嵌套字段","req":"字段路径由规则配置动态给出（地址在嵌套层），使用 getpath 传入路径数组取值。","expr":"getpath([\"profile\", \"contact\", \"address\", \"city\"])","status":"success","inp":{"profile":{"contact":{"address":{"city":"Chengdu"}}}},"out":"Chengdu","outText":null},{"id":53,"cat":"setpath 路径赋值","title":"按动态路径数组写入嵌套字段","req":"规则引擎需要在指定深层路径写入“已同步”标记，使用 setpath 创建/更新嵌套对象。","expr":".doc | setpath([\"meta\", \"sync\", \"status\"]; \"synced\")","status":"success","inp":{"doc":{"meta":{}}},"out":{"meta":{"sync":{"status":"synced"}}},"outText":null},{"id":54,"cat":"del 删除字段","title":"导出前剔除敏感内部字段","req":"对外导出客户资料时必须删除内部备注 internal_note 与内部评分 internal_score，使用 del。","expr":"del(.internal_note, .internal_score)","status":"success","inp":{"name":"客户甲","level":"A","internal_note":"风控观察中","internal_score":62,"owner":"销售一部"},"out":{"name":"客户甲","level":"A","owner":"销售一部"},"outText":null},{"id":55,"cat":"字段白名单选取","title":"只保留白名单字段输出","req":"接口返回字段众多，下游只需要 id、name、city 三个字段，使用 pick 保留指定键。","expr":"{id, name, city}","status":"success","inp":{"id":1001,"name":"孙丽","city":"Wuhan","age":29,"phone":"139****0000","score":88},"out":{"id":1001,"name":"孙丽","city":"Wuhan"},"outText":null},{"id":56,"cat":"敏感字段剔除","title":"剔除黑名单敏感字段","req":"审计导出时除身份证、银行卡号外其余字段全部保留，使用 omit 按键名剔除。","expr":"del(.id_card, .bank_card)","status":"success","inp":{"name":"钱伟","id_card":"4401**********1234","bank_card":"6222********6688","department":"采购部"},"out":{"name":"钱伟","department":"采购部"},"outText":null},{"id":57,"cat":"to_entries","title":"把统计对象转换为键值条目数组","req":"图表组件需要 [{key, value}] 格式的数据，使用 to_entries 转换对象。","expr":".sales | to_entries","status":"success","inp":{"sales":{"east":320,"west":210,"north":260,"south":180}},"out":[{"key":"east","value":320},{"key":"west","value":210},{"key":"north","value":260},{"key":"south","value":180}],"outText":null},{"id":58,"cat":"from_entries 还原","title":"由键值条目数组还原为对象","req":"处理完成的条目数组需要从 [{key, value}] 还原回原始对象结构，使用 from_entries。","expr":".entries | from_entries","status":"success","inp":{"entries":[{"key":"q1","value":120},{"key":"q2","value":158},{"key":"q3","value":97}]},"out":{"q1":120,"q2":158,"q3":97},"outText":null},{"id":59,"cat":"with_entries 批量改键","title":"把指标键名统一加前缀后还原对象","req":"埋点上报规范要求所有本地指标键加 local_ 前缀，使用 with_entries 批量改 key。","expr":".metrics | with_entries(.key = \"local_\" + .key)","status":"success","inp":{"metrics":{"page_view":1200,"click":350,"share":42}},"out":{"local_page_view":1200,"local_click":350,"local_share":42},"outText":null},{"id":60,"cat":"键排序","title":"对象按键名字母序重新排列","req":"配置文件 diff 前需要把对象按键名排序，使用 keys_unsorted 对照与 to_entries 排序演示。","expr":"with_entries(.key |= .) | to_entries | sort_by(.key) | from_entries","status":"success","inp":{"zebra":3,"apple":1,"mango":2,"banana":4},"out":{"apple":1,"banana":4,"mango":2,"zebra":3},"outText":null},{"id":61,"cat":"reduce 求和","title":"用 reduce 计算订单金额累加","req":"演示 reduce 累加器：初始化 0，遍历每笔订单把金额累加到状态变量。","expr":"reduce .orders[] as $o (0; . + $o.amount)","status":"success","inp":{"orders":[{"amount":88.0},{"amount":156.0},{"amount":42.5},{"amount":70.0}]},"out":356.5,"outText":null},{"id":62,"cat":"reduce 极值","title":"reduce 找出最大订单金额","req":"不依赖 max，用 reduce 维护当前最大值，遍历更新状态。","expr":"reduce .amounts[] as $a (0; if $a > . then $a else . end)","status":"success","inp":{"amounts":[34.5,298.0,76.2,412.8,59.9]},"out":412.8,"outText":null},{"id":63,"cat":"reduce 分组计数","title":"reduce 按状态统计订单数量","req":"汇总每个状态出现次数，reduce 累加器是一个对象，按状态键自增。","expr":"reduce .orders[] as $o ({}; .[$o.status] += 1)","status":"success","inp":{"orders":[{"status":"paid"},{"status":"unpaid"},{"status":"paid"},{"status":"paid"},{"status":"cancelled"}]},"out":{"paid":3,"unpaid":1,"cancelled":1},"outText":null},{"id":64,"cat":"reduce 拼接字符串","title":"reduce 拼接标签成逗号分隔串","req":"把标签数组 reduce 拼接成 “#tag1 #tag2” 形式，演示字符串累加与空串初始值。","expr":"reduce .tags[] as $t (\"\"; . + \"#\" + $t)","status":"success","inp":{"tags":["户外","防水","大容量"]},"out":"#户外#防水#大容量","outText":null},{"id":65,"cat":"reduce 构造数组","title":"reduce 收集符合条件的字段","req":"遍历员工，reduce 累积器是数组，把月薪高于 15000 的员工姓名推入结果数组。","expr":"reduce .staff[] as $s ([]; if $s.salary > 15000 then . + [$s.name] else . end)","status":"success","inp":{"staff":[{"name":"甲","salary":12000},{"name":"乙","salary":18500},{"name":"丙","salary":15600},{"name":"丁","salary":9800}]},"out":["乙","丙"],"outText":null},{"id":66,"cat":"foreach 状态流","title":"foreach 输出库存余额滚动变化序列","req":"演示 foreach 三步（初始化、更新、输出），逐笔出库后输出当前余额序列。","expr":"foreach .outbound[] as $q ( .stock; . - $q; . )","status":"success","inp":{"stock":100,"outbound":[12,20,8,25]},"out":null,"outText":"88\n68\n60\n35"},{"id":67,"cat":"变量绑定","title":"绑定 $total 供后续表达式复用","req":"先计算总额，绑定到变量 $total，再计算折扣、税额、净额，避免重复表达式。","expr":"(.items | map(.price * .qty) | add) as $total | {gross: $total, discount: .discount, net_pre_tax: ($total - .discount), tax: (($total - .discount) * .tax_rate), net: (($total - .discount) * (1 + .tax_rate))}","status":"success","inp":{"items":[{"price":100.0,"qty":2},{"price":80.0,"qty":1}],"discount":20.0,"tax_rate":0.13},"out":{"gross":280,"discount":20,"net_pre_tax":260,"tax":33.800000000000004,"net":293.79999999999995},"outText":null},{"id":68,"cat":"解构绑定","title":"用 $item | {price, qty} as $p 解构字段","req":"遍历购物车时把每条商品的 price、qty 绑定到命名变量，代码更清晰可读。","expr":"[.cart[] | . as $item | {price, qty} as $p | {name: $item.name, subtotal: ($p.price * $p.qty)}]","status":"success","inp":{"cart":[{"price":49.9,"qty":2,"name":"A"},{"price":120.0,"qty":1,"name":"B"}]},"out":[{"name":"A","subtotal":99.8},{"name":"B","subtotal":120}],"outText":null},{"id":69,"cat":"reduce 嵌套聚合","title":"按部门 reduce 汇总薪资总额","req":"员工数组含部门与薪资，reduce 累加器按部门聚合薪资总和。","expr":"reduce .employees[] as $e ({}; .[$e.dept] += $e.salary)","status":"success","inp":{"employees":[{"dept":"研发","salary":22000},{"dept":"市场","salary":15000},{"dept":"研发","salary":26000},{"dept":"市场","salary":18000}]},"out":{"研发":48000,"市场":33000},"outText":null},{"id":70,"cat":"reduce 最值带索引","title":"reduce 找出销量最高商品及其名称","req":"需要同时记录最大销量和对应商品名，reduce 状态对象维护 {name, qty}。","expr":"reduce .products[] as $p ({name: \"\", qty: 0}; if $p.sold > .qty then {name: $p.name, qty: $p.sold} else . end)","status":"success","inp":{"products":[{"name":"键盘","sold":320},{"name":"鼠标","sold":510},{"name":"耳机","sold":438}]},"out":{"name":"鼠标","qty":510},"outText":null},{"id":71,"cat":"自定义函数","title":"def 定义含税单价函数并复用","req":"报表多处需要计算含税价（单价 × 1.13），定义本地函数 `with_tax` 供两次调用。","expr":"def with_tax: . * 1.13; [.products[] | {name, price_with_tax: (.price | with_tax)}]","status":"success","inp":{"products":[{"name":"显示器","price":1200.0},{"name":"支架","price":180.0}]},"out":[{"name":"显示器","price_with_tax":1355.9999999999998},{"name":"支架","price_with_tax":203.39999999999998}],"outText":null},{"id":72,"cat":"自定义函数带参","title":"def 定义按比例折扣的函数","req":"折扣比例不固定，定义函数 `disc($rate)` 接收比例参数，对不同商品套不同折扣。","expr":"def disc($p; $r): $p * $r; [.items[] | {name, final: disc(.price; .rate)}]","status":"success","inp":{"items":[{"name":"外套","price":599.0,"rate":0.8},{"name":"T恤","price":129.0,"rate":0.9}]},"out":[{"name":"外套","final":479.20000000000005},{"name":"T恤","final":116.10000000000001}],"outText":null},{"id":73,"cat":"try catch 容错","title":"字段缺失时捕获错误返回默认值","req":"部分记录缺少嵌套地址节点，访问结果为空；用 // 空值合并兜底返回“未知城市”，保证列表不出现 null。","expr":"[.records[] | (.address.city // \"未知城市\")]","status":"success","inp":{"records":[{"user":"甲","address":{"city":"Nanjing"}},{"user":"乙"}]},"out":["Nanjing","未知城市"],"outText":null},{"id":74,"cat":"错误抑制 ?","title":"链式访问用 ? 抑制缺失错误","req":"批量处理历史数据时层级不固定，整条链每个环节都加 ?，缺失则结果为空而不是中断。","expr":"[.nodes[].a?.b?.c?]","status":"success","inp":{"nodes":[{"a":{"b":{"c":1}}},{"a":{}},{"x":2}]},"out":[1,null,null],"outText":null},{"id":75,"cat":"error 主动抛错","title":"校验不满足时主动抛出错误信息","req":"数量必须为正数，否则用 error 抛出“数量非法”，演示主动 error 与条件组合。","expr":"if .order.qty > 0 then .order else error(\"数量非法: qty=\" + (.order.qty | tostring)) end","status":"expected_error","inp":{"order":{"sku":"S1","qty":0}},"out":null,"outText":"jq: error (at <stdin>:0): 数量非法: qty=0"},{"id":76,"cat":"类型安全转换","title":"字符串转数字失败时保持空值","req":"脏数据里可能混入非数字字符串，tonumber 配合 try 失败返回 null，避免整条管道崩溃。","expr":"[.values[] | if . == null then null else try tonumber catch null end]","status":"success","inp":{"values":["128","abc","45.6",null,"89"]},"out":[128,null,45.6,null,89],"outText":null},{"id":77,"cat":"空值合并","title":"多层回退：邮箱→手机→默认账号","req":"通知账号优先级：优先邮箱，缺失用手机，都缺失回退“guest”，用 // 链式回退。","expr":".email // .phone // \"guest\"","status":"success","inp":{"user":{"name":"陈晨"}},"out":"guest","outText":null},{"id":78,"cat":"错误与条件配合","title":"金额为负时抛错并附带上下文","req":"校验金额不能为负，错误信息中拼出实际金额便于定位脏数据。","expr":"if .payment.amount < 0 then error(\"订单 \" + .payment.order_no + \" 金额为负: \" + (.payment.amount | tostring)) else .payment.amount end","status":"expected_error","inp":{"payment":{"amount":-30.0,"order_no":"O-998"}},"out":null,"outText":"jq: error (at <stdin>:0): 订单 O-998 金额为负: -30"},{"id":79,"cat":"复合错误捕获","title":"批量执行多条提取并记录失败项","req":"对多条记录分别提取嵌套评论数，失败项归类到 errors 数组，成功项进入 comments。","expr":"{comments: [.posts[] | .meta.comments? // empty], failed_ids: [.posts[] | select(.meta == null) | .id]}","status":"success","inp":{"posts":[{"id":1,"meta":{"comments":12}},{"id":2},{"id":3,"meta":{"comments":0}}]},"out":{"comments":[12,0],"failed_ids":[2]},"outText":null},{"id":80,"cat":"递归安全访问","title":"递归查找标签并抑制结构差异错误","req":"不同商品属性树层级不一，递归取 tags 时全程加 ? 容错。","expr":"[.. | objects | .tags? // empty] | flatten","status":"success","inp":{"goods":[{"tags":["户外"]},{"attrs":{"tags":["夏季"]}},{"price":99.0}]},"out":["户外","夏季"],"outText":null},{"id":81,"cat":"test 正则判断","title":"校验邮箱格式是否合法","req":"注册表单用 test 匹配标准邮箱正则，返回布尔值。","expr":".email | test(\"^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\\\.[A-Za-z]{2,}$\")","status":"success","inp":{"email":"zhang.san+tag@example.com.cn"},"out":true,"outText":null},{"id":82,"cat":"scan 全部匹配","title":"扫描文本中全部手机号","req":"客服会话文本里散落多个手机号，scan 把全部匹配依次输出。","expr":"[.text | scan(\"1\\\\d{10}\")]","status":"success","inp":{"text":"联系 13866218890 或备用 15900112233，工单里还有 13755556666。"},"out":["13866218890","15900112233","13755556666"],"outText":null},{"id":83,"cat":"match 捕获组","title":"match 解析文件名 名称-版本.扩展名","req":"文件名规范为 name-v1.2.3.ext，match 捕获 groups 与 offset，演示 match 结构。","expr":".filename | match(\"(?<name>.+)-(?<ver>[0-9.]+)\\\\.(?<ext>[a-z]+)\")","status":"success","inp":{"filename":"report-2026.11.02.pdf"},"out":{"offset":0,"length":21,"string":"report-2026.11.02.pdf","captures":[{"offset":0,"length":6,"string":"report","name":"name"},{"offset":7,"length":10,"string":"2026.11.02","name":"ver"},{"offset":18,"length":3,"string":"pdf","name":"ext"}]},"outText":null},{"id":84,"cat":"capture 提取分组","title":"capture 从时间字符串提取年月日","req":"日志时间 “2026-11-02 17:30:00”，capture 分组输出 year/month/day 对象。","expr":".log_time | capture(\"(?<year>\\\\d{4})-(?<month>\\\\d{2})-(?<day>\\\\d{2})\")","status":"success","inp":{"log_time":"2026-11-02 17:30:00"},"out":{"year":"2026","month":"11","day":"02"},"outText":null},{"id":85,"cat":"sub 单次替换","title":"sub 把首个逗号替换为竖线","req":"仅替换第一个分隔符用于日志对齐，sub 只替换一次。","expr":".line | sub(\",\"; \"|\")","status":"success","inp":{"line":"alpha,beta,gamma,delta"},"out":"alpha|beta,gamma,delta","outText":null},{"id":86,"cat":"gsub 全局替换","title":"gsub 把所有空白压缩替换为单空格","req":"评论文本含多个连续空格与制表符，gsub 正则全局压缩。","expr":".comment | gsub(\"\\\\s+\"; \" \") | gsub(\"^ | $\"; \"\")","status":"success","inp":{"comment":"   商品  质量很好\t\t物流很快  "},"out":"商品 质量很好 物流很快","outText":null},{"id":87,"cat":"正则不区分大小写","title":"test 带 flag i 忽略大小写匹配关键词","req":"敏感词检查不区分大小写，匹配 “VIP” 的各种大小写写法，演示 flags 参数。","expr":"[.text | scan(\"(?i)vip\")]","status":"success","inp":{"text":"This is a vip member, also VIP user."},"out":["vip","VIP"],"outText":null},{"id":88,"cat":"正则捕获重组","title":"capture 后重组中文姓名拼音顺序","req":"英文姓名 “Bond James”，捕获名和姓后重组成 “James Bond” 输出。","expr":".name | capture(\"(?<last>\\\\w+) (?<first>\\\\w+)\") | .first + \" \" + .last","status":"success","inp":{"name":"Bond James"},"out":"James Bond","outText":null},{"id":89,"cat":"正则多行匹配","title":"scan 提取多行配置中的端口号","req":"配置块跨多行，scan 遍历每行匹配 listen 后面的端口数字。 us":"success","inp":{"order":{"amount":320.0,"category":"digital"},"coupons":[{"name":"满300减30","threshold":300,"category":"digital","valid":true},{"name":"满100减10","threshold":100,"category":"clothing","valid":true},{"name":"数码专属50","threshold":200,"category":"digital","valid":false},{"name":"新店券20","threshold":50,"category":"digital","valid":true}]},"out":[{"name":"满300减30","threshold":300},{"name":"新店券20","threshold":50}],"outText":null},{"id":109,"cat":"地址标准化","title":"从嵌套地址拼装标准收件信息串","req":"面单需要按“收件人 电话 省市区 详细地址”顺序拼成一行，缺失字段回退默认值。","expr":".receiver | .name + \" \" + .phone + \" \" + (.province // \"\") + (.city // \"\") + (.district // \"\") + .detail","status":"success","inp":{"receiver":{"name":"黄先生","phone":"136****8821","province":"广东省","city":"深圳市","district":"龙华区","detail":"民治大道 66 号 3 栋 502"}},"out":"黄先生 136****8821 广东省深圳市龙华区民治大道 66 号 3 栋 502","outText":null},{"id":110,"cat":"订单状态机","title":"按状态映射中文文案与是否可取消","req":"前端根据状态码展示中文文案与可操作按钮，使用映射对象查找，未知状态回退“未知”。","expr":".statuses | map({code: ., text: ({created: \"待付款\", paid: \"已付款\", shipped: \"已发货\", completed: \"已完成\", cancelled: \"已取消\"}[.] // \"未知\"), cancellable: (. == \"created\" or . == \"paid\")})","status":"success","inp":{"statuses":["created","paid","shipped","completed","cancelled","unknown"]},"out":[{"code":"created","text":"待付款","cancellable":true},{"code":"paid","text":"已付款","cancellable":true},{"code":"shipped","text":"已发货","cancellable":false},{"code":"completed","text":"已完成","cancellable":false},{"code":"cancelled","text":"已取消","cancellable":false},{"code":"unknown","text":"未知","cancellable":false}],"outText":null},{"id":111,"cat":"物流轨迹","title":"提取最新物流节点与时间","req":"物流轨迹按时间正序返回，详情页需要最新一条节点的描述和时间。","expr":".tracking[-1]","status":"success","inp":{"tracking":[{"time":"2026-11-01 09:20","desc":"已揽收"},{"time":"2026-11-01 22:10","desc":"到达广州转运中心"},{"time":"2026-11-02 08:45","desc":"派送中，快递员 李师傅"}]},"out":{"time":"2026-11-02 08:45","desc":"派送中，快递员 李师傅"},"outText":null},{"id":112,"cat":"工单 SLA","title":"统计超 SLA 未关闭工单数量与平均响应时长","req":"客服系统需要统计响应超时工单条数，并计算已解决工单平均响应分钟数。","expr":"([.tickets[] | select(.status == \"closed\")]) as $closed | {over_sla: ([.tickets[] | select(.response_min > .sla_min)] | length), closed_count: ($closed | length), avg_response: (([$closed[].response_min] | add) / ($closed | length))}","status":"success","inp":{"tickets":[{"id":"T1","status":"closed","response_min":12,"sla_min":30},{"id":"T2","status":"open","response_min":45,"sla_min":30},{"id":"T3","status":"closed","response_min":8,"sla_min":30},{"id":"T4","status":"open","response_min":35,"sla_min":30}]},"out":{"over_sla":2,"closed_count":2,"avg_response":10},"outText":null},{"id":113,"cat":"工单分类","title":"按工单来源与等级二维分组","req":"运营周报需要按来源（app/web/phone）和等级（P1/P2/P3）归类工单，输出分组结构。","expr":".tickets | group_by(.source) | map({source: .[0].source, by_level: (group_by(.level) | map({level: .[0].level, count: length}))})","status":"success","inp":{"tickets":[{"source":"app","level":"P1","title":"支付失败"},{"source":"web","level":"P2","title":"页面报错"},{"source":"app","level":"P2","title":"无法登录"},{"source":"phone","level":"P1","title":"订单错付"}]},"out":[{"source":"app","by_level":[{"level":"P1","count":1},{"level":"P2","count":1}]},{"source":"phone","by_level":[{"level":"P1","count":1}]},{"source":"web","by_level":[{"level":"P2","count":1}]}],"outText":null},{"id":114,"cat":"售后原因分布","title":"提取退货原因并做词频统计","req":"售后记录里 reason 字段重复出现，统计各原因出现次数并按次数倒序。","expr":"[.aftersales[].reason] | group_by(.) | map({reason: .[0], count: length}) | sort_by(-.count)","status":"success","inp":{"aftersales":[{"reason":"尺码不合适"},{"reason":"质量问题"},{"reason":"七天无理由"},{"reason":"质量问题"},{"reason":"尺码不合适"},{"reason":"发错货"}]},"out":[{"reason":"尺码不合适","count":2},{"reason":"质量问题","count":2},{"reason":"七天无理由","count":1},{"reason":"发错货","count":1}],"outText":null},{"id":115,"cat":"快递揽收时效","title":"计算各运单从下单到揽收的小时差","req":"用下单时间与揽收时间字符串比较，输出每单揽收延迟小时数（演示日期字符串与数值映射）。","expr":"[.shipments[] | {order_time, pickup_time, delayed_hours: (if .pickup_time == null then null else ((.pickup_time | strptime(\"%Y-%m-%d %H:%M\") | mktime) - (.order_time | strptime(\"%Y-%m-%d %H:%M\") | mktime)) / 3600 end)}]","status":"success","inp":{"shipments":[{"order_time":"2026-11-01 08:00","pickup_time":"2026-11-01 10:30"},{"order_time":"2026-11-01 14:00","pickup_time":"2026-11-01 14:15"},{"order_time":"2026-11-02 09:00","pickup_time":null}]},"out":[{"order_time":"2026-11-01 08:00","pickup_time":"2026-11-01 10:30","delayed_hours":2.5},{"order_time":"2026-11-01 14:00","pickup_time":"2026-11-01 14:15","delayed_hours":0.25},{"order_time":"2026-11-02 09:00","pickup_time":null,"delayed_hours":null}],"outText":null},{"id":116,"cat":"区域订单密度","title":"按城市汇总订单量并找出订单量最高城市","req":"物流选址需要各城市订单量统计与榜首城市，分组聚合后用 max_by 取第一。","expr":".orders | group_by(.city) | map({city: .[0].city, count: length, total: (map(.amount) | add)}) | . as $g | {regions: $g, top: ($g | max_by(.total))}","status":"success","inp":{"orders":[{"city":"深圳","amount":320},{"city":"广州","amount":210},{"city":"深圳","amount":180},{"city":"东莞","amount":96},{"city":"广州","amount":260}]},"out":{"regions":[{"city":"东莞","count":1,"total":96},{"city":"广州","count":2,"total":470},{"city":"深圳","count":2,"total":500}],"top":{"city":"深圳","count":2,"total":500}},"outText":null},{"id":117,"cat":"物流商对比","title":"对比各物流商平均时效与平均运费","req":"按承运商分组，计算平均配送天数与平均运费，返回对比表。","expr":".shipments | group_by(.carrier) | map({carrier: .[0].carrier, avg_days: (map(.days) | add / length), avg_fee: (map(.fee) | add / length)})","status":"success","inp":{"shipments":[{"carrier":"SF","days":2,"fee":18.0},{"carrier":"ZT","days":3,"fee":10.0},{"carrier":"SF","days":1,"fee":22.0},{"carrier":"ZT","days":4,"fee":8.5}]},"out":[{"carrier":"SF","avg_days":1.5,"avg_fee":20},{"carrier":"ZT","avg_days":3.5,"avg_fee":9.25}],"outText":null},{"id":118,"cat":"异常件标记","title":"筛选停滞超过 3 天的异常物流","req":"轨迹最后节点时间距当前超过 3 天视为停滞，结合状态字段输出异常运单列表。","expr":"[.packages[] | select(.last_update < \"2026-10-30\") | {tracking, last_update, status}]","status":"success","inp":{"packages":[{"tracking":"SF001","last_update":"2026-10-29","status":"transit"},{"tracking":"ZT002","last_update":"2026-11-01","status":"transit"},{"tracking":"YT003","last_update":"2026-10-25","status":"stuck"}]},"out":[{"tracking":"SF001","last_update":"2026-10-29","status":"transit"},{"tracking":"YT003","last_update":"2026-10-25","status":"stuck"}],"outText":null},{"id":119,"cat":"工单流转节点","title":"提取工单审批链路全部节点与处理人","req":"工单 history 是嵌套节点数组，需要递归提取所有处理人姓名形成审批链。","expr":"[.. | objects | .operator? // empty]","status":"success","inp":{"ticket":{"history":[{"operator":"客服小王","action":"创建","children":[{"operator":"组长李工","action":"审核","children":[{"operator":"主管张总","action":"批准"}]}]}]}},"out":["客服小王","组长李工","主管张总"],"outText":null},{"id":120,"cat":"退款金额校验","title":"校验退款金额不超过原支付金额","req":"遍历退款单，refund 超过 paid 的标记为异常，输出正常单与异常单两组。","expr":"{normal: [.refunds[] | select(.refund <= .paid)], abnormal: [.refunds[] | select(.refund > .paid) | .no]}","status":"success","inp":{"refunds":[{"no":"R1","paid":200.0,"refund":200.0},{"no":"R2","paid":150.0,"refund":180.0},{"no":"R3","paid":80.0,"refund":50.0}]},"out":{"normal":[{"no":"R1","paid":200,"refund":200},{"no":"R3","paid":80,"refund":50}],"abnormal":["R2"]},"outText":null},{"id":121,"cat":"组织层级","title":"递归遍历组织树收集全部员工姓名","req":"部门树层层嵌套 teams，需要递归把所有层级人员姓名扁平收集。","expr":"[.. | objects | .members? // empty] | flatten","status":"success","inp":{"org":{"name":"总部","members":[],"teams":[{"name":"研发部","members":["甲","乙"],"teams":[{"name":"前端组","members":["丙","丁"]}]},{"name":"市场部","members":["戊"]}]}},"out":["甲","乙","丙","丁","戊"],"outText":null},{"id":122,"cat":"部门薪资汇总","title":"按部门汇总薪资总额与人均薪资","req":"HR 报表按部门统计人数、薪资合计、人均薪资，并按合计倒序。","expr":".employees | group_by(.dept) | map({dept: .[0].dept, headcount: length, total: (map(.salary) | add), avg: (map(.salary) | add / length)}) | sort_by(-.total)","status":"success","inp":{"employees":[{"name":"甲","dept":"研发","salary":22000},{"name":"乙","dept":"研发","salary":26000},{"name":"丙","dept":"市场","salary":15000},{"name":"丁","dept":"市场","salary":18000},{"name":"戊","dept":"人事","salary":13000}]},"out":[{"dept":"研发","headcount":2,"total":48000,"avg":24000},{"dept":"市场","headcount":2,"total":33000,"avg":16500},{"dept":"人事","headcount":1,"total":13000,"avg":13000}],"outText":null},{"id":123,"cat":"权限角色","title":"检查用户是否拥有指定资源的操作权限","req":"用户角色与资源权限矩阵组合，判断是否允许删除文档；列出其全部可操作权限。","expr":".user.roles as $rs | [.roles[$rs[]] | .permissions[]] | unique as $p | {permissions: $p, can_delete: ($p | index(\"delete\") != null)}","status":"success","inp":{"user":{"name":"林工","roles":["developer","reviewer"]},"roles":{"developer":{"permissions":["read","write"]},"reviewer":{"permissions":["read","comment"]},"admin":{"permissions":["read","write","delete"]}}},"out":{"permissions":["comment","read","write"],"can_delete":false},"outText":null},{"id":124,"cat":"菜单可见性","title":"按角色过滤可见菜单项","req":"后端返回全部菜单，前端根据用户角色与菜单 required_role 计算可见菜单路径。","expr":". as $root | [.menus[] as $m | select($m.role == \"any\" or ($root.user_roles | index($m.role))) | $m.path]","status":"success","inp":{"user_roles":["editor"],"menus":[{"path":"/dashboard","role":"any"},{"path":"/article/edit","role":"editor"},{"path":"/admin/settings","role":"admin"},{"path":"/article/review","role":"reviewer"}]},"out":["/dashboard","/article/edit"],"outText":null},{"id":125,"cat":"考勤统计","title":"统计本月迟到次数与出勤天数","req":"考勤记录含状态与打卡时间，统计迟到天数、正常出勤天数与缺卡次数。","expr":"{normal: [.attendance[] | select(.status == \"normal\")] | length, late: [.attendance[] | select(.status == \"late\")] | length, missing: [.attendance[] | select(.status == \"missing\")] | length}","status":"success","inp":{"attendance":[{"date":"11-01","status":"normal"},{"date":"11-02","status":"late"},{"date":"11-03","status":"normal"},{"date":"11-04","status":"missing"},{"date":"11-05","status":"late"}]},"out":{"normal":2,"late":2,"missing":1},"outText":null},{"id":126,"cat":"员工筛选排序","title":"筛选 30 岁以上工程师并按薪资降序","req":"人才盘点需要 department 为研发、age >= 30 的人员，按薪资降序输出姓名与薪资。","expr":"[.staff[] | select(.dept == \"研发\" and .age >= 30) | {name, salary}] | sort_by(-.salary)","status":"success","inp":{"staff":[{"name":"A","dept":"研发","age":28,"salary":20000},{"name":"B","dept":"研发","age":34,"salary":28000},{"name":"C","dept":"市场","age":31,"salary":17000},{"name":"D","dept":"研发","age":36,"salary":31000}]},"out":[{"name":"D","salary":31000},{"name":"B","salary":28000}],"outText":null},{"id":127,"cat":"汇报关系","title":"找出没有直接下属的基层员工","req":"人员档案里 reports 数组为下属列表，筛选下属为空的员工。","expr":"[.people[] | select((.reports | length) == 0) | .name]","status":"success","inp":{"people":[{"name":"张总","reports":["李经理","王经理"]},{"name":"李经理","reports":["员工甲"]},{"name":"王经理","reports":[]},{"name":"员工甲","reports":[]}]},"out":["王经理","员工甲"],"outText":null},{"id":128,"cat":"职级分布","title":"统计各职级人数占比","req":"组织盘点需要每个职级人数与占总人数百分比。","expr":"(.employees | length) as $total | [.employees[].level] | group_by(.) | map({level: .[0], count: length, ratio: (length / $total)})","status":"success","inp":{"employees":[{"level":"P5"},{"level":"P6"},{"level":"P6"},{"level":"P7"},{"level":"P5"},{"level":"P7"},{"level":"P7"}]},"out":[{"level":"P5","count":2,"ratio":0.2857142857142857},{"level":"P6","count":2,"ratio":0.2857142857142857},{"level":"P7","count":3,"ratio":0.42857142857142855}],"outText":null},{"id":129,"cat":"证书有效期","title":"筛选证书即将在 90 天内到期的员工","req":"安全岗需要提前复审证书，根据 expire 日期字符串筛选临近过期人员。","expr":"[.certificates[] | select(.expire < \"2027-02-01\") | {name, cert, expire}]","status":"success","inp":{"certificates":[{"name":"陈工","cert":"内审员","expire":"2026-12-20"},{"name":"刘工","cert":"电工证","expire":"2027-06-01"},{"name":"赵工","cert":"叉车证","expire":"2026-11-25"}]},"out":[{"name":"陈工","cert":"内审员","expire":"2026-12-20"},{"name":"赵工","cert":"叉车证","expire":"2026-11-25"}],"outText":null},{"id":130,"cat":"薪酬带宽校验","title":"标记薪资超出本职级带宽上下限的人员","req":"职级带宽对象给出 min/max，遍历员工判断处于带内、超上限、低于下限。","expr":". as $root | [.staff[] | .level as $lv | $root.bands[$lv] as $b | {name: .name, status: (if .salary > $b[1] then \"超上限\" elif .salary < $b[0] then \"低于下限\" else \"带内\" end)}]","status":"success","inp":{"bands":{"P5":[15000,22000],"P6":[20000,30000],"P7":[28000,42000]},"staff":[{"name":"甲","level":"P6","salary":26000},{"name":"乙","level":"P5","salary":24000},{"name":"丙","level":"P7","salary":25000}]},"out":[{"name":"甲","status":"带内"},{"name":"乙","status":"超上限"},{"name":"丙","status":"低于下限"}],"outText":null},{"id":131,"cat":"日志级别统计","title":"统计日志中各级别出现次数","req":"排障时先看 ERROR/WARN/INFO 分布，按 level 分组计数并倒序。","expr":"[.logs[].level] | group_by(.) | map({level: .[0], count: length}) | sort_by(-.count)","status":"success","inp":{"logs":[{"level":"INFO","msg":"request ok"},{"level":"ERROR","msg":"db timeout"},{"level":"WARN","msg":"slow query"},{"level":"ERROR","msg":"500"},{"level":"INFO","msg":"started"},{"level":"WARN","msg":"retry"}]},"out":[{"level":"ERROR","count":2},{"level":"INFO","count":2},{"level":"WARN","count":2}],"outText":null},{"id":132,"cat":"错误码分布","title":"按错误码聚合出现频次与最近一次时间","req":"监控面板需要每个错误码出现次数与最后出现时间，用于判断是否持续复发。","expr":".errors | group_by(.code) | map({code: .[0].code, count: length, last_time: .[-1].time})","status":"success","inp":{"errors":[{"code":"E1001","time":"10:01"},{"code":"E2003","time":"10:02"},{"code":"E1001","time":"10:05"},{"code":"E1001","time":"10:09"},{"code":"E2003","time":"10:12"}]},"out":[{"code":"E1001","count":3,"last_time":"10:09"},{"code":"E2003","count":2,"last_time":"10:12"}],"outText":null},{"id":133,"cat":"BMC 传感器阈值","title":"筛选温度/电压越限的传感器告警","req":"服务器 BMC 上报多类传感器，temp 超过 75、voltage 偏离标称 ±10% 即判定越限，输出告警列表。","expr":"[.sensors[] | if .type == \"temp\" then select(.value > .threshold) elif .type == \"voltage\" then select((.value - .nominal) / .nominal | fabs > 0.1) else empty end | {name, type, value}]","status":"success","inp":{"sensors":[{"name":"CPU0_Temp","type":"temp","value":68.2,"threshold":75.0},{"name":"CPU1_Temp","type":"temp","value":81.5,"threshold":75.0},{"name":"VDD_Core","type":"voltage","value":0.98,"nominal":1.0},{"name":"12V_Rail","type":"voltage","value":10.6,"nominal":12.0},{"name":"Fan0_Speed","type":"fan","value":1800}]},"out":[{"name":"CPU1_Temp","type":"temp","value":81.5},{"name":"12V_Rail","type":"voltage","value":10.6}],"outText":null},{"id":134,"cat":"指标时间窗聚合","title":"计算每台主机 CPU 平均、峰值与空闲率","req":"时序样本按 host 分组，计算 avg、max、min 以及均值空闲占比。","expr":".metrics | group_by(.host) | map({host: .[0].host, avg_cpu: (map(.cpu) | add / length), max_cpu: (map(.cpu) | max), min_cpu: (map(.cpu) | min), avg_idle: (map(.idle) | add / length)})","status":"success","inp":{"metrics":[{"host":"node-a","cpu":62,"idle":38},{"host":"node-a","cpu":78,"idle":22},{"host":"node-b","cpu":45,"idle":55},{"host":"node-a","cpu":55,"idle":45}]},"out":[{"host":"node-a","avg_cpu":65,"max_cpu":78,"min_cpu":55,"avg_idle":35},{"host":"node-b","avg_cpu":45,"max_cpu":45,"min_cpu":45,"avg_idle":55}],"outText":null},{"id":135,"cat":"告警分级筛选","title":"筛选 P1/P2 且未恢复的活跃告警","req":"值班群只推送级别 P1、P2 且 status 不是 resolved 的告警，提取主机、级别、摘要。","expr":"[.alerts[] | select((.level == \"P1\" or .level == \"P2\") and .status != \"resolved\") | {host, level, summary}]","status":"success","inp":{"alerts":[{"host":"node-a","level":"P1","status":"firing","summary":"CPU 过载"},{"host":"node-b","level":"P3","status":"firing","summary":"磁盘偏慢"},{"host":"node-c","level":"P2","status":"resolved","summary":"内存告警"},{"host":"node-d","level":"P2","status":"firing","summary":"风扇异常"}]},"out":[{"host":"node-a","level":"P1","summary":"CPU 过载"},{"host":"node-d","level":"P2","summary":"风扇异常"}],"outText":null},{"id":136,"cat":"端口监听清单","title":"提取所有 LISTEN 状态端口与进程名","req":"服务器网络巡检需要列出监听中的本地端口、协议与对应进程。","expr":"[.connections[] | select(.state == \"LISTEN\") | {proto, local, process}]","status":"success","inp":{"connections":[{"proto":"tcp","local":"0.0.0.0:80","state":"LISTEN","process":"nginx"},{"proto":"tcp","local":"0.0.0.0:22","state":"LISTEN","process":"sshd"},{"proto":"tcp","local":"10.0.0.5:53211","state":"ESTABLISHED","process":"java"}]},"out":[{"proto":"tcp","local":"0.0.0.0:80","process":"nginx"},{"proto":"tcp","local":"0.0.0.0:22","process":"sshd"}],"outText":null},{"id":137,"cat":"磁盘使用率","title":"找出使用率超过 85% 的挂载点","req":"容量巡检筛选 usage_percent > 85 的文件系统，输出挂载点、总量、已用与剩余。","expr":"[.disks[] | select(.usage_percent > 85) | {mount, total_gb, used_gb, free_gb: (.total_gb - .used_gb), usage_percent}]","status":"success","inp":{"disks":[{"mount":"/","total_gb":200,"used_gb":168,"usage_percent":84.0},{"mount":"/data","total_gb":1000,"used_gb":912,"usage_percent":91.2},{"mount":"/var/log","total_gb":100,"used_gb":30,"usage_percent":30.0}]},"out":[{"mount":"/data","total_gb":1000,"used_gb":912,"free_gb":88,"usage_percent":91.2}],"outText":null},{"id":138,"cat":"服务依赖拓扑","title":"递归收集某服务依赖链上全部下游服务","req":"微服务拓扑中 children 为下游依赖，从根服务递归展开收集全部下游名称。","expr":"[.. | objects | .name? // empty]","status":"success","inp":{"service":{"name":"gateway","children":[{"name":"auth","children":[{"name":"user-db"}]},{"name":"order","children":[{"name":"order-db"},{"name":"inventory"}]}]}},"out":["gateway","auth","user-db","order","order-db","inventory"],"outText":null},{"id":139,"cat":"超时配置梳理","title":"提取各下游接口超时与重试次数并排序","req":"从服务配置中提取 endpoint、timeout_ms、retries，按超时时间倒序排查慢调用。","expr":"[.services | to_entries[] | {service: .key, timeout_ms: .value.timeout_ms, retries: .value.retries}] | sort_by(.timeout_ms) | reverse","status":"success","inp":{"services":{"payment":{"timeout_ms":3000,"retries":2},"inventory":{"timeout_ms":500,"retries":3},"coupon":{"timeout_ms":1200,"retries":1}}},"out":[{"service":"payment","timeout_ms":3000,"retries":2},{"service":"coupon","timeout_ms":1200,"retries":1},{"service":"inventory","timeout_ms":500,"retries":3}],"outText":null},{"id":140,"cat":"容器状态汇总","title":"统计各运行状态容器数量并列出异常容器","req":"K8s 视角统计 Running/CrashLoopBackOff/Completed 数量，并单独列出异常容器名。","expr":"{summary: ([.pods[].status] | group_by(.) | map({status: .[0], count: length})), abnormal: [.pods[] | select(.status != \"Running\" and .status != \"Completed\") | .name]}","status":"success","inp":{"pods":[{"name":"api-7f9","status":"Running"},{"name":"worker-2d1","status":"CrashLoopBackOff"},{"name":"cron-a","status":"Completed"},{"name":"api-8k2","status":"Running"},{"name":"cache-9x3","status":"CrashLoopBackOff"}]},"out":{"summary":[{"status":"Completed","count":1},{"status":"CrashLoopBackOff","count":2},{"status":"Running","count":2}],"abnormal":["worker-2d1","cache-9x3"]},"outText":null},{"id":141,"cat":"支付流水对账","title":"按支付渠道汇总成功交易金额与笔数","req":"财务对账按 channel 统计交易成功（success）笔数与总金额，排除退款失败流水。","expr":"[.transactions[] | select(.status == \"success\")] | group_by(.channel) | map({channel: .[0].channel, count: length, total: (map(.amount) | add)})","status":"success","inp":{"transactions":[{"channel":"wechat","amount":120.0,"status":"success"},{"channel":"alipay","amount":350.0,"status":"success"},{"channel":"wechat","amount":88.0,"status":"refunded"},{"channel":"unionpay","amount":500.0,"status":"success"},{"channel":"alipay","amount":66.0,"status":"failed"}]},"out":[{"channel":"alipay","count":1,"total":350},{"channel":"unionpay","count":1,"total":500},{"channel":"wechat","count":1,"total":120}],"outText":null},{"id":142,"cat":"发票信息解析","title":"校验发票抬头与税号格式并拼接开票信息","req":"B 端开票需要公司名、税号（18 位）、地址电话、开户行，判断税号长度并组装开票串。","expr":".invoice | {tax_no_valid: (.tax_no | test(\"^[A-Z0-9]{18}$\")), header: (.company + \"|\" + .tax_no + \"|\" + .address_phone + \"|\" + .bank)}","status":"success","inp":{"invoice":{"company":"深圳示例科技有限公司","tax_no":"91440300MA5EXAMPLE","address_phone":"0755-88886666","bank":"中国银行深圳科技园支行 7777****0001"}},"out":{"tax_no_valid":true,"header":"深圳示例科技有限公司|91440300MA5EXAMPLE|0755-88886666|中国银行深圳科技园支行 7777****0001"},"outText":null},{"id":143,"cat":"CRM 客户分层","title":"按累计消费与下单次数划分客户等级","req":"累计消费 >= 5000 且次数 >= 5 为 VIP；>= 1000 为活跃；其余为普通，输出分层名单。","expr":"[.customers[] | {name, tier: (if .total_spent >= 5000 and .orders >= 5 then \"VIP\" elif .total_spent >= 1000 then \"活跃\" else \"普通\" end)}]","status":"success","inp":{"customers":[{"name":"甲","total_spent":6200,"orders":8},{"name":"乙","total_spent":2300,"orders":3},{"name":"丙","total_spent":380,"orders":1},{"name":"丁","total_spent":5100,"orders":4}]},"out":[{"name":"甲","tier":"VIP"},{"name":"乙","tier":"活跃"},{"name":"丙","tier":"普通"},{"name":"丁","tier":"活跃"}],"outText":null},{"id":144,"cat":"客户标签合并","title":"合并多来源客户标签并去重保序","req":"三个来源的标签数组合并去重，保留首次出现顺序，形成统一画像标签集。","expr":"[.source_a, .source_b, .source_c] | flatten | unique","status":"success","inp":{"source_a":["数码","男性"],"source_b":["数码","通勤","深圳"],"source_c":["男性","价格敏感"]},"out":["价格敏感","数码","深圳","男性","通勤"],"outText":null},{"id":145,"cat":"嵌套配置扁平化","title":"把嵌套配置键拍平为点分隔路径对象","req":"配置中心需要把嵌套 JSON 转为 app.server.port 形式的扁平键值对，用递归 reduce 实现。","expr":". as $root | reduce (paths(scalars) | map(tostring) | join(\".\")) as $p ({}; .[$p] = ($root | getpath($p | split(\".\"))))","status":"success","inp":{"app":{"server":{"port":8080,"timeout":3000},"feature":{"cache":true,"debug":false}}},"out":{"app.server.port":8080,"app.server.timeout":3000,"app.feature.cache":true},"outText":null},{"id":146,"cat":"多环境配置覆盖","title":"按环境合并基础配置与环境专属覆盖项","req":"base 配置为公共项，env 配置（prod）覆盖同名键，不存在则继承，输出最终生效配置。","expr":".base + .env.prod","status":"success","inp":{"base":{"host":"0.0.0.0","port":8080,"log_level":"info","replicas":2},"env":{"prod":{"port":9090,"log_level":"warn","replicas":6}}},"out":{"host":"0.0.0.0","port":9090,"log_level":"warn","replicas":6},"outText":null},{"id":147,"cat":"DNS 记录整理","title":"按记录类型分组并提取目标域名","req":"DNS 导出含 A/CNAME/MX/TXT 记录，按 type 分组，列出每条记录名称与值。","expr":".records | group_by(.type) | map({type: .[0].type, entries: map({name, value})})","status":"success","inp":{"records":[{"type":"A","name":"@","value":"1.2.3.4"},{"type":"CNAME","name":"www","value":"origin.example.com"},{"type":"MX","name":"@","value":"mail.example.com","priority":10},{"type":"A","name":"cdn","value":"5.6.7.8"}]},"out":[{"type":"A","entries":[{"name":"@","value":"1.2.3.4"},{"name":"cdn","value":"5.6.7.8"}]},{"type":"CNAME","entries":[{"name":"www","value":"origin.example.com"}]},{"type":"MX","entries":[{"name":"@","value":"mail.example.com"}]}],"outText":null},{"id":148,"cat":"API 响应归一化","title":"把异构接口响应统一为标准列表结构","req":"上游有的返回 data.list、有的返回 data.items，需要归一化提取并映射 id/title/status。","expr":"{from_a: [.api_a.data.list[] | {id, title: .name, status: .state}], from_b: [.api_b.data.items[] | {id, title, status: .state}]}","status":"success","inp":{"api_a":{"code":0,"data":{"list":[{"id":1,"name":"A","state":1}]}},"api_b":{"code":0,"data":{"items":[{"id":2,"title":"B","state":0}]}}},"out":{"from_a":[{"id":1,"title":"A","status":1}],"from_b":[{"id":2,"title":"B","status":0}]},"outText":null},{"id":149,"cat":"分页信息计算","title":"根据总数、当前页、每页条数计算总页数与是否有下一页","req":"前端分页器需要 total_pages、has_next、has_prev，基于 total、page、page_size 计算。","expr":"{total, page, page_size, total_pages: ((.total + .page_size - 1) / .page_size | ceil), has_prev: (.page > 1), has_next: (.page < ((.total + .page_size - 1) / .page_size | ceil))}","status":"success","inp":{"total":83,"page":2,"page_size":20},"out":{"total":83,"page":2,"page_size":20,"total_pages":6,"has_prev":true,"has_next":true},"outText":null},{"id":150,"cat":"埋点漏斗","title":"计算漏斗各环节转化率","req":"漏斗步骤按顺序给出人数，计算相邻环节转化率与首环节到末环节整体转化率。","expr":".funnel as $f | [range(0; $f | length) | . as $i | {step: $f[$i].step, users: $f[$i].users, next_rate: (if $i + 1 < ($f | length) then ($f[$i + 1].users / $f[$i].users) else null end)}] | . + [{step: \"整体\", users: null, overall_rate: ($f[-1].users / $f[0].users)}]","status":"success","inp":{"funnel":[{"step":"浏览","users":12000},{"step":"详情","users":5400},{"step":"加购","users":1800},{"step":"下单","users":620}]},"out":[{"step":"浏览","users":12000,"next_rate":0.45},{"step":"详情","users":5400,"next_rate":0.3333333333333333},{"step":"加购","users":1800,"next_rate":0.34444444444444444},{"step":"下单","users":620,"next_rate":null},{"step":"整体","users":null,"overall_rate":0.051666666666666666}],"outText":null},{"id":151,"cat":"集合并集","title":"合并两组用户权限去重","req":"角色权限与个人附加权限合并成最终权限集，重复项只保留一次。","expr":"[.role_perms[], .extra_perms[]] | unique","status":"success","inp":{"role_perms":["read","write","comment"],"extra_perms":["comment","export","read"]},"out":["comment","export","read","write"],"outText":null},{"id":152,"cat":"集合交集","title":"求用户同时拥有的两组标签交集","req":"画像系统求基础标签与扩展标签的交集，用于圈选重合人群。","expr":". as $root | [.base[] as $b | select($root.extend | index($b)) | $b]","status":"success","inp":{"base":["数码","学生","通勤","男性"],"extend":["通勤","深圳","价格敏感","男性"]},"out":["通勤","男性"],"outText":null},{"id":153,"cat":"集合差集","title":"找出基线清单中缺失的新商品","req":"对比本期商品与上期商品，差集即为本期新增、本期下架两组。","expr":". as $root | {added: [.current[] as $c | select($root.previous | index($c) | not) | $c], removed: [.previous[] as $p | select($root.current | index($p) | not) | $p]}","status":"success","inp":{"current":["P1","P2","P3","P5"],"previous":["P1","P2","P4"]},"out":{"added":["P3","P5"],"removed":["P4"]},"outText":null},{"id":154,"cat":"多字段排序","title":"先按部门升序、再按薪资降序排列员工","req":"花名册默认部门 A-Z，同部门内薪资从高到低，sort_by 传多键数组。","expr":".staff | sort_by(.dept, -.salary)","status":"success","inp":{"staff":[{"name":"甲","dept":"研发","salary":22000},{"name":"乙","dept":"市场","salary":17000},{"name":"丙","dept":"研发","salary":30000},{"name":"丁","dept":"市场","salary":21000}]},"out":[{"name":"丁","dept":"市场","salary":21000},{"name":"乙","dept":"市场","salary":17000},{"name":"丙","dept":"研发","salary":30000},{"name":"甲","dept":"研发","salary":22000}],"outText":null},{"id":155,"cat":"去重保留最新","title":"同一订单多条状态记录保留最新一条","req":"状态变更流水可能重复，按订单号分组后取 update_time 最大的记录。","expr":".records | group_by(.order_no) | map(max_by(.time))","status":"success","inp":{"records":[{"order_no":"O1","status":"created","time":"09:00"},{"order_no":"O1","status":"paid","time":"09:20"},{"order_no":"O2","status":"created","time":"09:05"},{"order_no":"O1","status":"shipped","time":"11:00"},{"order_no":"O2","status":"paid","time":"09:40"}]},"out":[{"order_no":"O1","status":"shipped","time":"11:00"},{"order_no":"O2","status":"paid","time":"09:40"}],"outText":null},{"id":156,"cat":"数组转置","title":"把矩阵行转列（二维数组转置）","req":"表格原始数据按行存储，绘图需要按列取值，演示 zip 式转置。","expr":".matrix as $m | [range(0; $m[0] | length) as $i | [$m[] | .[$i]]]","status":"success","inp":{"matrix":[[1,2,3],[4,5,6],[7,8,9]]},"out":[[1,4,7],[2,5,8],[3,6,9]],"outText":null},{"id":157,"cat":"多维数组求和","title":"多层嵌套销量数组展平后求和","req":"按大区→门店→品类嵌套的销量数据，先 flatten 再 add 得到全网总销量。","expr":".sales | flatten | add","status":"success","inp":{"sales":[[120,[80,45]],[200,[60]],[90,110,[30,20]]]},"out":755,"outText":null},{"id":158,"cat":"笛卡尔组合","title":"生成颜色与尺码的全部 SKU 组合","req":"商品有颜色列表和尺码列表，需要两两组合生成完整 SKU 变体清单。","expr":"[.colors[] as $c | .sizes[] as $s | {color: $c, size: $s, sku: ($c + \"-\" + $s)}]","status":"success","inp":{"colors":["黑","白","灰"],"sizes":["S","M","L"]},"out":[{"color":"黑","size":"S","sku":"黑-S"},{"color":"黑","size":"M","sku":"黑-M"},{"color":"黑","size":"L","sku":"黑-L"},{"color":"白","size":"S","sku":"白-S"},{"color":"白","size":"M","sku":"白-M"},{"color":"白","size":"L","sku":"白-L"},{"color":"灰","size":"S","sku":"灰-S"},{"color":"灰","size":"M","sku":"灰-M"},{"color":"灰","size":"L","sku":"灰-L"}],"outText":null},{"id":159,"cat":"对象数组 join 键","title":"把订单明细按订单号连接用户信息","req":"用户表与订单表分离，按 user_id 关联，输出用户名与订单号组合视图。","expr":".orders as $os | [.users[] as $u | $os[] | select(.user_id == $u.id) | {user: $u.name, order_no: .no}]","status":"success","inp":{"users":[{"id":1,"name":"甲"},{"id":2,"name":"乙"}],"orders":[{"user_id":1,"no":"O1"},{"user_id":2,"no":"O2"},{"user_id":1,"no":"O3"}]},"out":[{"user":"甲","order_no":"O1"},{"user":"甲","order_no":"O3"},{"user":"乙","order_no":"O2"}],"outText":null},{"id":160,"cat":"分组后二次映射","title":"按城市分组并把组内订单号拼成字符串","req":"周报需要每个城市一行，组内订单号用逗号拼接，配合 to_entries 形态输出。","expr":".orders | group_by(.city) | map({city: .[0].city, orders: (map(.no) | join(\",\"))})","status":"success","inp":{"orders":[{"city":"深圳","no":"O1"},{"city":"广州","no":"O2"},{"city":"深圳","no":"O3"},{"city":"广州","no":"O4"}]},"out":[{"city":"广州","orders":"O2,O4"},{"city":"深圳","orders":"O1,O3"}],"outText":null},{"id":161,"cat":"树深度统计","title":"统计分类树最大嵌套深度","req":"分类目录 children 递归嵌套，需要求出树的最大层级深度。","expr":"def depth: if (.children | length) == 0 then 1 else 1 + ([.children[] | depth] | max) end; .category | depth","status":"success","inp":{"category":{"name":"根","children":[{"name":"一级","children":[{"name":"二级","children":[{"name":"三级","children":[]}]}]},{"name":"一级B"}]}},"out":4,"outText":null},{"id":162,"cat":"树节点计数","title":"递归统计目录树全部节点数量与叶子数量","req":"知识库结构治理需要统计总节点数与叶子文档数。","expr":"{total: ([.node | .. | objects] | length), leaves: ([.node | .. | objects | select((.children // []) | length == 0)] | length)}","status":"success","inp":{"node":{"title":"根","children":[{"title":"章节一","children":[{"title":"文档A"},{"title":"文档B"}]},{"title":"章节二","children":[{"title":"文档C"}]}]}},"out":{"total":6,"leaves":3},"outText":null},{"id":163,"cat":"递归查找字段","title":"在嵌套 JSON 中递归查找指定键的全部值","req":"配置结构多变，需要在任意层级找到所有 endpoint 字段值。","expr":"[.. | objects | .endpoint? // empty]","status":"success","inp":{"server":{"api":{"endpoint":"/v1/api"},"admin":{"panel":{"endpoint":"/admin"},"internal":{"endpoint":"/internal"}}}},"out":["/v1/api","/admin","/internal"],"outText":null},{"id":164,"cat":"路径定位节点","title":"按路径数组定位深层对象并返回其兄弟键","req":"规则引擎给定路径数组，先 getpath 取值，再列出该对象的全部键。","expr":"getpath([\"config\", \"services\", \"payment\"]) | keys","status":"success","inp":{"config":{"services":{"payment":{"timeout":3000,"retries":2,"enabled":true}}}},"out":["enabled","retries","timeout"],"outText":null},{"id":165,"cat":"walk 递归变换","title":"递归把所有数字字符串转为数字","req":"历史导出 JSON 中数值都是字符串，walk 递归遍历对象数组统一 tonumber。","expr":"walk(if type == \"object\" then with_entries(if (.value | type) == \"string\" and (.value | test(\"^-?[0-9.]+$\")) then .value |= tonumber else . end) elif type == \"array\" then map(.) else . end)","status":"success","inp":{"stock":{"a":"120","b":{"c":"88.5"},"tags":["x","y"],"meta":{"active":"true"}}},"out":{"stock":{"a":120,"b":{"c":88.5},"tags":["x","y"],"meta":{"active":"true"}}},"outText":null},{"id":166,"cat":"树结构扁平化为层级列表","title":"把菜单树拍平为带层级深度的扁平列表","req":"侧边栏渲染需要扁平节点并携带 depth 与父级 id，递归构造。","expr":"def walk_menu($depth): ([{id: .id, label: .label, depth: $depth}] + [.children[]? | walk_menu($depth + 1)]) | flatten; .menu | walk_menu(0)","status":"success","inp":{"menu":{"id":1,"label":"首页","children":[{"id":2,"label":"商品","children":[{"id":4,"label":"手机"},{"id":5,"label":"配件"}]},{"id":3,"label":"关于"}]}},"out":[{"id":1,"label":"首页","depth":0},{"id":2,"label":"商品","depth":1},{"id":4,"label":"手机","depth":2},{"id":5,"label":"配件","depth":2},{"id":3,"label":"关于","depth":1}],"outText":null},{"id":167,"cat":"嵌套对象展开","title":"把员工嵌套信息展开为扁平报表行","req":"导出 Excel 需要把 name、contact.phone、address.city 展开成同一条扁平记录。","expr":"[.employees[] | {name, phone: .contact.phone, email: (.contact.email // \"-\"), city: .address.city}]","status":"success","inp":{"employees":[{"name":"甲","contact":{"phone":"130****1","email":"a@x.com"},"address":{"city":"深圳"}},{"name":"乙","contact":{"phone":"131****2"},"address":{"city":"广州"}}]},"out":[{"name":"甲","phone":"130****1","email":"a@x.com","city":"深圳"},{"name":"乙","phone":"131****2","email":"-","city":"广州"}],"outText":null},{"id":168,"cat":"深层缺失容错递归","title":"递归提取所有存在的 email，跳过缺失节点","req":"通讯录数据层级不统一，递归取 email 时缺失节点不得报错。","expr":"[.. | objects | .email? // empty]","status":"success","inp":{"groups":[{"members":[{"email":"a@x.com"},{"name":"无邮箱"}]},{"members":[{"email":"b@y.com"},{"contacts":{"email":"c@z.com"}}]}]},"out":["a@x.com","b@y.com","c@z.com"],"outText":null},{"id":169,"cat":"层级路径拼接","title":"为树节点生成从根到节点的完整面包屑路径","req":"文档树需要每个叶子的完整路径，如“根/章节一/文档A”，递归携带前缀。","expr":"def crumb($prefix): ($prefix + .title) as $cur | .title as $t | if (.children // []) | length == 0 then $cur else [.children[] | crumb($prefix + $t + \"/\")] | flatten end; .node | crumb(\"\")","status":"success","inp":{"node":{"title":"根","children":[{"title":"章节一","children":[{"title":"文档A"},{"title":"文档B"}]},{"title":"章节二"}]}},"out":["根/章节一/文档A","根/章节一/文档B","根/章节二"],"outText":null},{"id":170,"cat":"嵌套聚合计数","title":"统计各分类下二级分类数量与商品总数","req":"类目表按一级分类分组，统计其二级分类个数和商品条目总数。","expr":"[.categories[] | {name, sub_count: (.subs | length), goods_total: ([.subs[].goods] | add)}]","status":"success","inp":{"categories":[{"name":"数码","subs":[{"name":"手机","goods":120},{"name":"耳机","goods":86}]},{"name":"服饰","subs":[{"name":"男装","goods":210},{"name":"女装","goods":190},{"name":"鞋靴","goods":77}]}]},"out":[{"name":"数码","sub_count":2,"goods_total":206},{"name":"服饰","sub_count":3,"goods_total":477}],"outText":null},{"id":171,"cat":"多行文本解析","title":"逐行解析配置键值对为对象","req":"配置以多行 key=value 文本给出，按行 split 后再按等号拆成对象。","expr":"[.raw | split(\"\\n\") | .[] | split(\"=\") | {key: .[0], value: .[1]}] | from_entries","status":"success","inp":{"raw":"host=0.0.0.0\nport=8080\ntimeout=3000\ndebug=false"},"out":{"host":"0.0.0.0","port":"8080","timeout":"3000","debug":"false"},"outText":null},{"id":172,"cat":"字符串拆分重组","title":"解析 ISO 日期并输出中文格式日期","req":"日志时间 2026-11-02，拆出年月日后格式化为“2026 年 11 月 02 日”。","expr":".iso_date | split(\"-\") | .[0] + \" 年 \" + .[1] + \" 月 \" + .[2] + \" 日\"","status":"success","inp":{"iso_date":"2026-11-02"},"out":"2026 年 11 月 02 日","outText":null},{"id":173,"cat":"日期差计算","title":"计算两个时间戳相差的天数","req":"会员有效期判断需要算出签发日与到期日相差天数，先转 epoch 再除 86400。","expr":"((.expire | strptime(\"%Y-%m-%d\") | mktime) - (.issued | strptime(\"%Y-%m-%d\") | mktime)) / 86400","status":"success","inp":{"issued":"2026-06-01","expire":"2026-11-02"},"out":154,"outText":null},{"id":174,"cat":"时间戳归一","title":"统一毫秒/秒级时间戳为秒级 epoch","req":"历史埋点混用秒级与毫秒级时间戳，按长度判断并除以 1000 归一。","expr":"[.samples[] | if (tostring | length) > 10 then . / 1000 else . end]","status":"success","inp":{"samples":[1761982200,1761982200000,1761982200]},"out":[1761982200,1761982200,1761982200],"outText":null},{"id":175,"cat":"数值精度四舍五入","title":"金额保留两位小数并计算平均客单价","req":"报表金额需要两位小数，先求和除以人数再 round 到分；演示 round 与浮点处理。","expr":"{sum: (([.orders[].amount] | add) * 100 | round / 100), avg: ((([.orders[].amount] | add) / (.orders | length)) * 100 | round / 100)}","status":"success","inp":{"orders":[{"amount":128.5},{"amount":99.9},{"amount":350.0},{"amount":76.25}]},"out":{"sum":654.65,"avg":163.66},"outText":null},{"id":176,"cat":"单位换算","title":"字节数换算为 GB/MB/KB 可读单位","req":"磁盘用量原始字节，根据量级选择 B/KB/MB/GB 并保留一位小数。","expr":".bytes as $b | if $b >= 1073741824 then (($b / 1073741824) * 10 | round / 10 | tostring) + \" GB\" elif $b >= 1048576 then (($b / 1048576) * 10 | round / 10 | tostring) + \" MB\" elif $b >= 1024 then (($b / 1024) * 10 | round / 10 | tostring) + \" KB\" else ($b | tostring) + \" B\" end","status":"success","inp":{"bytes":3842432123},"out":"3.6 GB","outText":null},{"id":177,"cat":"Unicode 字符处理","title":"统计中文字符长度并去除首尾空格","req":"昵称含中文与首尾空白，先去首尾空白再取 length，演示 Unicode 按字符计数。","expr":".nickname | gsub(\"^[ \\t]+|[ \\t]+$\"; \"\") as $c | {clean: $c, length: ($c | length)}","status":"success","inp":{"nickname":"  星辰大海与远方  "},"out":{"clean":"星辰大海与远方","length":7},"outText":null},{"id":178,"cat":"货币格式化","title":"把金额格式化为千分位人民币字符串","req":"结算页展示 ¥12,345.67：把整数部分反转后按每 3 位分组插入逗号，再反转还原，小数部分原样保留。","expr":".amount | tostring | split(\".\") as $p | ($p[0] | explode | reverse | implode) as $rev | ([$rev | scan(\"...|..|.\")] | join(\",\") | explode | reverse | implode) as $int | {amount_str: ($int + \".\" + ($p[1] // \"00\")), with_prefix: (\"¥\" + $int + \".\" + ($p[1] // \"00\")), integer_part: $p[0], decimal_part: ($p[1] // \"00\")}","status":"success","inp":{"amount":12345.67},"out":{"amount_str":"12,345.67","with_prefix":"¥12,345.67","integer_part":"12345","decimal_part":"67"},"outText":null},{"id":179,"cat":"字符串截断","title":"超长标题截断到 20 字符并追加省略号","req":"列表标题超过 20 个字符截断加 “…”，未超长则原样返回。","expr":".title as $t | if ($t | length) > 20 then ($t[0:20] + \"…\") else $t end","status":"success","inp":{"tit // ===== 工具函数 =====
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function hlJsonText(text){
  return esc(text).replace(
    /("(?:\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(?:\s*:)?|\btrue\b|\bfalse\b|\bnull\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g,
    function(m){
      let cls='jn';
      if(/^"/.test(m)){ cls = /:\s*$/.test(m) ? 'jk' : 'js'; }
      else if(/^(true|false)$/.test(m)){ cls='jb'; }
      else if(/^null$/.test(m)){ cls='jnl'; }
      return '<span class="'+cls+'">'+m+'</span>';
    });
}

function pretty(obj){ return JSON.stringify(obj, null, 2); }

// 单块 JSON / 裸值高亮
function hlBlock(text){
  try{ JSON.parse(text); return '<pre class="multi-val">'+hlJsonText(text)+'</pre>'; }
  catch(e){ return '<pre class="multi-val">'+esc(text)+'</pre>'; }
}

// jq 多值输出：逐块解析，无法解析的行作为纯文本
function renderMulti(text, isErr){
  const lines = text.split(/\r?\n/);
  let buf=[], blocks=[];
  for(const ln of lines){
    buf.push(ln);
    const trial = buf.join('\n');
    try{ JSON.parse(trial); blocks.push({ok:true, text:trial}); buf=[]; }catch(e){}
  }
  if(buf.length) blocks.push({ok:false, text:buf.join('\n')});
  if(blocks.length===1 && blocks[0].ok===false){
    return '<pre>'+esc(blocks[0].text)+'</pre>';
  }
  return blocks.map(function(b,i){
    const sep = i>0 ? '<div class="multi-sep">—— 下一个输出值 ——</div>' : '';
    return sep + (b.ok ? hlBlock(b.text) : '<pre>'+esc(b.text)+'</pre>');
  }).join('');
}

function statusLabel(s){
  if(s==='expected_error') return '预期抛出错误';
  return '执行成功';
}

// ===== 渲染单张卡片 =====
function renderCard(c){
  const isErr = c.status==='expected_error';
  const inHtml = c.inp===null
    ? '<pre class="empty">（无输入数据）</pre>'
    : '<pre>'+hlJsonText(pretty(c.inp))+'</pre>';

  let outHtml;
  if(c.out!==null && c.out!==undefined){
    outHtml = '<pre>'+hlJsonText(pretty(c.out))+'</pre>';
  } else if(c.outText && c.outText.trim()!==''){
    outHtml = renderMulti(c.outText, isErr);
  } else {
    outHtml = '<pre class="empty">（空输出）</pre>';
  }

  return ''+
  '<article class="card" data-id="'+c.id+'">'+
    '<div class="card-head">'+
      '<div class="card-top">'+
        '<span class="badge-id">#'+String(c.id).padStart(3,'0')+'</span>'+
        '<span class="tag-cat">'+esc(c.cat)+'</span>'+
        '<span class="status '+c.status+'">'+statusLabel(c.status)+'</span>'+
        '<button type="button" class="copy-btn fold-btn" data-fold="'+c.id+'">折叠</button>'+
      '</div>'+
      '<h2 class="card-title">'+esc(c.title)+'</h2>'+
    '</div>'+
    '<div class="card-body">'+
      '<div class="req"><span class="req-label">客户需求</span>'+esc(c.req)+'</div>'+
      '<div class="expr">'+
        '<div class="expr-head"><span class="lbl">jq 表达式</span>'+
        '<button type="button" class="copy-btn" data-expr="'+c.id+'">复制表达式</button></div>'+
        '<pre>'+esc(c.expr)+'</pre>'+
      '</div>'+
      '<div class="compare">'+
        '<section class="panel in">'+
          '<div class="panel-head"><span>输入 JSON</span><span class="kind">input</span></div>'+inHtml+
        '</section>'+
        '<section class="panel out'+(isErr?' err':'')+'">'+
          '<div class="panel-head"><span>执行结果</span><span class="kind">output</span></div>'+outHtml+
        '</section>'+
      '</div>'+
    '</div>'+
  '</article>';
}

// ===== 筛选与列表渲染 =====
const listEl=document.getElementById('list');
const searchEl=document.getElementById('search');
const catEl=document.getElementById('catFilter');
const statusEl=document.getElementById('statusFilter');

// 初始化分类下拉
(function(){
  const cats=[...new Set(CASES.map(c=>c.cat))].sort();
  catEl.innerHTML='<option value="">全部分类</option>'+
    cats.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');
  document.getElementById('total').textContent=CASES.length;
  document.getElementById('nOk').textContent=CASES.filter(c=>c.status==='success').length;
  document.getElementById('nErr').textContent=CASES.filter(c=>c.status==='expected_error').length;
})();

function filtered(){
  const q=searchEl.value.trim().toLowerCase();
  const cat=catEl.value, st=statusEl.value;
  return CASES.filter(function(c){
    if(cat && c.cat!==cat) return false;
    if(st && c.status!==st) return false;
    if(!q) return true;
    return (c.title+' '+c.req+' '+c.expr+' '+c.cat).toLowerCase().includes(q);
  });
}

function renderList(){
  const rows=filtered();
  listEl.innerHTML=rows.map(renderCard).join('');
  document.getElementById('shown').textContent=rows.length;
  document.getElementById('emptyTip').style.display=rows.length?'none':'block';
}

searchEl.addEventListener('input',renderList);
catEl.addEventListener('change',renderList);
statusEl.addEventListener('change',renderList);

// 复制 + 折叠（事件委托）
listEl.addEventListener('click',function(ev){
  const copy=ev.target.closest('[data-expr]');
  if(copy){
    const c=CASES.find(x=>x.id===Number(copy.dataset.expr));
    copyText(c.expr);
    copy.textContent='已复制';
    setTimeout(()=>copy.textContent='复制表达式',1200);
    return;
  }
  const fold=ev.target.closest('[data-fold]');
  if(fold){
    const card=fold.closest('.card');
    const body=card.querySelector('.card-body');
    const hidden=body.style.display==='none';
    body.style.display=hidden?'':'none';
    fold.textContent=hidden?'折叠':'展开';
  }
});

function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(function(){ fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}
